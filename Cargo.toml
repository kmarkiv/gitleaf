[package]
name = "gitleaf"
version = "0.3.5"
edition = "2021"
description = "Small self-hosted Overleaf-style LaTeX editor; every paper is a git repository."
license = "MIT"
repository = "https://github.com/kmarkiv/gitleaf"
homepage = "https://github.com/kmarkiv/gitleaf"
readme = "README.md"
keywords = ["latex", "editor", "git", "overleaf", "tectonic"]
categories = ["text-editors"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
sha2 = "0.10.9"
futures-util = { version = "0.3", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
