name: release

# Builds one self-contained binary per platform and attaches them to a GitHub release.
# Trigger: push a tag like v0.2.0, or run the workflow by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            asset: gitleaf-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: gitleaf-macos-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: gitleaf-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: gitleaf-linux-arm64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: gitleaf-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo test --locked
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          cargo metadata --no-deps --format-version 1 | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{if(JSON.parse(s).packages[0].version!==require("./package.json").version)process.exit(1)})'
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: rename
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/gitleaf.exe dist/${{ matrix.asset }}
          else
            cp target/${{ matrix.target }}/release/gitleaf dist/${{ matrix.asset }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
